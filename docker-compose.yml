services:
  php-apache:
    build: ./docker
    container_name: php-apache
    restart: always
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
    networks:
      - app_network
    env_file: .env # ← 追加

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    env_file: .env
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3305:3305"
    volumes:
      - data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/
    networks:
      - app_network

  node:
    image: node:18
    container_name: ts-compiler
    working_dir: /usr/src/app/frontend
    volumes:
      - ./frontend:/usr/src/app/frontend
    command: ["sh", "-c", "npm install && npm run watch"]
    networks:
      - app_network

networks:
  app_network:

volumes:
  data:
