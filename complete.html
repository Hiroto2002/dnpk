<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>登録完了画面</title>
        <link rel="stylesheet" href="css/style.css">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
        <script>
        $(function(){
            history.pushState(null, null, null);
            $(window).on("popstate", function(){
                history.pushState(null, null, null);
            });
        });
        </script>
        </head>

    <script>
        /* ピッチインピッチアウトによる拡大縮小を禁止 */
        document.documentElement.addEventListener('touchstart', function (e) {
        if (e.touches.length >= 2) {e.preventDefault();}
        }, {passive: false});
        /* ダブルタップによる拡大を禁止 */
        var t = 0;
        document.documentElement.addEventListener('touchend', function (e) {
        var now = new Date().getTime();
        if ((now - t) < 350){
            e.preventDefault();
        }
        t = now;
        }, false);
    </script>
    
    <body>
        <header style="text-align:center;line-height: 1.5;">
            <p class="title">どんぷく Order Entry System</p> 
        </header>
        <div class="complete">
            <p>登録完了しました！</p>
        </div>
        <div class="widget-list">
            <a href="index.html">トップページに戻る</a>
        </div>
        <footer style="text-align:center; font-size:20px;line-height: 11;" >
            <p style="color: rgb(255, 255, 255);">Copyright © DNPK.JP All Rights Reserved.</p> 
        </footer>
    </body>
</html>
